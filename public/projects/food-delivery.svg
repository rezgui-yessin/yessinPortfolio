<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="foodBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09121F"/>
      <stop offset="100%" stop-color="#121D30"/>
    </linearGradient>
    <linearGradient id="cardFood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#142338"/>
      <stop offset="100%" stop-color="#0E1928"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#foodBg)"/>
  <rect width="800" height="500" fill="none" stroke="rgba(148, 187, 224, 0.15)" stroke-width="1"/>

  <!-- Browser Header -->
  <rect width="800" height="38" fill="#070D16"/>
  <circle cx="22" cy="19" r="5" fill="#EF4444"/>
  <circle cx="38" cy="19" r="5" fill="#F59E0B"/>
  <circle cx="54" cy="19" r="5" fill="#10B981"/>
  <rect x="180" y="8" width="440" height="22" rx="4" fill="#101C30" stroke="rgba(148, 187, 224, 0.2)" stroke-width="0.8"/>
  <text x="400" y="23" font-family="'JetBrains Mono', monospace" font-size="10" fill="#92A6BE" text-anchor="middle">https://food-delivery.app/orders/track/FD-8942</text>

  <!-- Left: Order Progress Timeline -->
  <g transform="translate(30, 60)">
    <rect width="320" height="400" rx="8" fill="url(#cardFood)" stroke="rgba(148, 187, 224, 0.2)" stroke-width="1"/>
    <text x="20" y="32" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#E7EEF6">Order #FD-8942 Live Status</text>
    <text x="20" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#92A6BE">Estimated arrival: 18:45 (12 mins)</text>

    <!-- Timeline Stepper -->
    <g transform="translate(30, 85)">
      <!-- Line -->
      <line x1="12" y1="12" x2="12" y2="240" stroke="#5AB9E8" stroke-width="2"/>

      <!-- Step 1 -->
      <circle cx="12" cy="12" r="8" fill="#10B981"/>
      <text x="32" y="16" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#E7EEF6">Order Accepted</text>
      <text x="32" y="30" font-family="'Inter', sans-serif" font-size="10" fill="#92A6BE">18:15 — Trattoria Bella Roma</text>

      <!-- Step 2 -->
      <circle cx="12" cy="85" r="8" fill="#10B981"/>
      <text x="32" y="89" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#E7EEF6">In Preparation</text>
      <text x="32" y="103" font-family="'Inter', sans-serif" font-size="10" fill="#92A6BE">18:22 — Chef started order</text>

      <!-- Step 3 -->
      <circle cx="12" cy="160" r="8" fill="#5AB9E8" stroke="#8CD4F5" stroke-width="3"/>
      <text x="32" y="164" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#8CD4F5">Courier En Route</text>
      <text x="32" y="178" font-family="'Inter', sans-serif" font-size="10" fill="#E8A33D">Live GPS tracking active</text>

      <!-- Step 4 -->
      <circle cx="12" cy="235" r="8" fill="#0A1220" stroke="rgba(148, 187, 224, 0.4)" stroke-width="2"/>
      <text x="32" y="239" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#5B6E86">Delivered</text>
      <text x="32" y="253" font-family="'Inter', sans-serif" font-size="10" fill="#5B6E86">Scheduled at doorstep</text>
    </g>

    <rect x="20" y="350" width="280" height="34" rx="4" fill="rgba(90, 185, 232, 0.15)" stroke="#5AB9E8" stroke-width="0.8"/>
    <text x="160" y="371" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#8CD4F5" text-anchor="middle">CONTACT COURIER (WHATSAPP)</text>
  </g>

  <!-- Right: Cart & Menu Items Summary -->
  <g transform="translate(370, 60)">
    <rect width="400" height="400" rx="8" fill="url(#cardFood)" stroke="rgba(148, 187, 224, 0.2)" stroke-width="1"/>
    <text x="24" y="32" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#E7EEF6">Basket &amp; Order Breakdown</text>

    <!-- Item 1 -->
    <g transform="translate(24, 55)">
      <rect width="352" height="60" rx="5" fill="#0A1220" stroke="rgba(148,187,224,0.1)"/>
      <text x="14" y="26" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#E7EEF6">Pizza Margherita Verace (x2)</text>
      <text x="14" y="44" font-family="'Inter', sans-serif" font-size="10" fill="#92A6BE">Extra buffalo mozzarella, basil leaves</text>
      <text x="338" y="32" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#6FCF97" text-anchor="end">€18.00</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(24, 125)">
      <rect width="352" height="60" rx="5" fill="#0A1220" stroke="rgba(148,187,224,0.1)"/>
      <text x="14" y="26" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#E7EEF6">Pasta al Tartufo Nero (x1)</text>
      <text x="14" y="44" font-family="'Inter', sans-serif" font-size="10" fill="#92A6BE">Fresh tagliolini, black truffle shavings</text>
      <text x="338" y="32" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#6FCF97" text-anchor="end">€16.50</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(24, 195)">
      <rect width="352" height="60" rx="5" fill="#0A1220" stroke="rgba(148,187,224,0.1)"/>
      <text x="14" y="26" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#E7EEF6">Tiramisù Artigianale (x2)</text>
      <text x="14" y="44" font-family="'Inter', sans-serif" font-size="10" fill="#92A6BE">Traditional recipe with espresso</text>
      <text x="338" y="32" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#6FCF97" text-anchor="end">€10.00</text>
    </g>

    <!-- Total Bill -->
    <line x1="24" y1="280" x2="376" y2="280" stroke="rgba(148, 187, 224, 0.2)"/>
    <text x="24" y="306" font-family="'Inter', sans-serif" font-size="12" fill="#92A6BE">Subtotal &amp; Delivery</text>
    <text x="376" y="306" font-family="'JetBrains Mono', monospace" font-size="12" fill="#E7EEF6" text-anchor="end">€44.50 + €2.50</text>
    <text x="24" y="334" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#E7EEF6">Total Paid (Card)</text>
    <text x="376" y="334" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#5AB9E8" text-anchor="end">€47.00</text>

    <text x="24" y="380" font-family="'JetBrains Mono', monospace" font-size="10" fill="#5B6E86">Angular SPA · Spring Boot State Machine · MySQL · JWT</text>
  </g>
</svg>
