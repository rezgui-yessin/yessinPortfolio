        <text x="14" y="60" font-family="'Inter', sans-serif" font-size="10" fill="#92A6BE">Pending SMS Confirmation</text>
        <rect x="180" y="14" width="72" height="18" rx="4" fill="rgba(232, 163, 61, 0.15)"/>
        <text x="216" y="27" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F5BE6B" text-anchor="middle">HOLD</text>
