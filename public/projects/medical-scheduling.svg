<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="medBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08101C"/>
      <stop offset="100%" stop-color="#0E192B"/>
    </linearGradient>
    <linearGradient id="cardGradMed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13233A"/>
      <stop offset="100%" stop-color="#0E192B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#medBg)"/>
  <rect width="800" height="500" fill="none" stroke="rgba(148, 187, 224, 0.15)" stroke-width="1"/>

  <!-- Browser Header -->
  <rect width="800" height="38" fill="#070D16"/>
  <circle cx="22" cy="19" r="5" fill="#EF4444"/>
  <circle cx="38" cy="19" r="5" fill="#F59E0B"/>
  <circle cx="54" cy="19" r="5" fill="#10B981"/>
  <rect x="180" y="8" width="440" height="22" rx="4" fill="#101C30" stroke="rgba(148, 187, 224, 0.2)" stroke-width="0.8"/>
  <text x="400" y="23" font-family="'JetBrains Mono', monospace" font-size="10" fill="#92A6BE" text-anchor="middle">https://med-schedule.clinic/doctor-portal</text>

  <!-- Sidebar -->
  <rect x="0" y="38" width="165" height="462" fill="#0A1422" stroke="rgba(148, 187, 224, 0.1)" stroke-width="1"/>
