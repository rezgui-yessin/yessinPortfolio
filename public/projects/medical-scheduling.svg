        <rect x="180" y="14" width="72" height="18" rx="4" fill="rgba(90, 185, 232, 0.15)"/>
        <text x="216" y="27" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8CD4F5" text-anchor="middle">OPEN</text>
