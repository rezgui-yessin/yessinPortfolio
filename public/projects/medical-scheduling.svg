      <!-- Slot 5 -->
      <g transform="translate(0, 168)">
        <rect width="265" height="72" rx="5" fill="#0C1726" stroke="rgba(90, 185, 232, 0.4)" stroke-width="1"/>
        <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#5AB9E8">02:00 – 02:45 PM</text>
