  <text x="35" y="108" font-family="'Inter', sans-serif" font-size="11" fill="#6FCF97">Doctor Schedule</text>
  <text x="35" y="142" font-family="'Inter', sans-serif" font-size="11" fill="#92A6BE">Patient Directory</text>
  <text x="35" y="174" font-family="'Inter', sans-serif" font-size="11" fill="#92A6BE">Consultation Slots</text>
  <text x="35" y="206" font-family="'Inter', sans-serif" font-size="11" fill="#92A6BE">Prescriptions</text>
  <text x="35" y="238" font-family="'Inter', sans-serif" font-size="11" fill="#92A6BE">Admin Security</text>

  <!-- Doctor Profile Card -->
  <g transform="translate(185, 54)">
    <rect width="590" height="66" rx="6" fill="url(#cardGradMed)" stroke="rgba(148, 187, 224, 0.2)" stroke-width="1"/>
    <circle cx="36" cy="33" r="18" fill="rgba(90, 185, 232, 0.2)" stroke="#5AB9E8" stroke-width="1.2"/>
    <text x="36" y="38" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#8CD4F5" text-anchor="middle">DR</text>
    <text x="68" y="28" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#E7EEF6">Dr. Robert Chen, MD</text>
    <text x="68" y="46" font-family="'Inter', sans-serif" font-size="11" fill="#92A6BE">Department of Cardiology · Role: CLINIC_DOCTOR</text>
    <rect x="475" y="22" width="95" height="22" rx="11" fill="rgba(111, 207, 151, 0.15)"/>
    <text x="522" y="36" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6FCF97" text-anchor="middle">RBAC AUTH</text>
