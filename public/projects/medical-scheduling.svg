        <rect width="265" height="72" rx="5" fill="#0C1726" stroke="rgba(111, 207, 151, 0.4)" stroke-width="1"/>
        <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#6FCF97">03:00 – 03:45 PM</text>
        <text x="14" y="44" font-family="'Inter', sans-serif" font-size="12" fill="#E7EEF6">Sara Moretti</text>
        <text x="14" y="60" font-family="'Inter', sans-serif" font-size="10" fill="#92A6BE">Hypertension Assessment</text>
        <rect x="180" y="14" width="72" height="18" rx="4" fill="rgba(111, 207, 151, 0.15)"/>
        <text x="216" y="27" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6FCF97" text-anchor="middle">BOOKED</text>
