<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1220"/>
      <stop offset="100%" stop-color="#0F1B2E"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14243B"/>
      <stop offset="100%" stop-color="#0F1B2E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="none" stroke="rgba(148, 187, 224, 0.15)" stroke-width="1"/>

  <!-- Window Header / Browser Chrome -->
  <rect width="800" height="38" fill="#080E18" border-bottom="1px solid rgba(148, 187, 224, 0.15)"/>
  <circle cx="22" cy="19" r="5" fill="#EF4444"/>
  <circle cx="38" cy="19" r="5" fill="#F59E0B"/>
  <circle cx="54" cy="19" r="5" fill="#10B981"/>
  <rect x="180" y="8" width="440" height="22" rx="4" fill="#101C30" stroke="rgba(148, 187, 224, 0.2)" stroke-width="0.8"/>
  <text x="400" y="23" font-family="'JetBrains Mono', monospace" font-size="10" fill="#92A6BE" text-anchor="middle">https://hotel-management.portal/dashboard</text>

  <!-- Sidebar -->
  <rect x="0" y="38" width="160" height="462" fill="#0B1524" stroke="rgba(148, 187, 224, 0.1)" stroke-width="1"/>
  <text x="20" y="70" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13" fill="#5AB9E8">HOTEL OPS</text>
  <rect x="15" y="90" width="130" height="28" rx="4" fill="rgba(90, 185, 232, 0.15)" stroke="#5AB9E8" stroke-width="0.8"/>
  <text x="35" y="108" font-family="'Inter', sans-serif" font-size="11" fill="#8CD4F5">Dashboard</text>
  <text x="35" y="142" font-family="'Inter', sans-serif" font-size="11" fill="#92A6BE">Room Inventory</text>
  <text x="35" y="174" font-family="'Inter', sans-serif" font-size="11" fill="#92A6BE">Live Calendar</text>
  <text x="35" y="206" font-family="'Inter', sans-serif" font-size="11" fill="#92A6BE">Reservations</text>
  <text x="35" y="238" font-family="'Inter', sans-serif" font-size="11" fill="#92A6BE">Billing &amp; Invoices</text>

  <!-- Top Metric Cards -->
  <g transform="translate(180, 56)">
    <!-- Card 1 -->
    <rect width="180" height="74" rx="6" fill="url(#cardGrad)" stroke="rgba(148, 187, 224, 0.2)" stroke-width="1"/>
    <text x="14" y="26" font-family="'Inter', sans-serif" font-size="11" fill="#92A6BE">Occupancy Rate</text>
    <text x="14" y="56" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="#E7EEF6">88.4%</text>
    <rect x="120" y="14" width="46" height="18" rx="9" fill="rgba(111, 207, 151, 0.15)"/>
    <text x="143" y="26" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6FCF97" text-anchor="middle">+6.2%</text>

    <!-- Card 2 -->
    <g transform="translate(196, 0)">
      <rect width="180" height="74" rx="6" fill="url(#cardGrad)" stroke="rgba(148, 187, 224, 0.2)" stroke-width="1"/>
      <text x="14" y="26" font-family="'Inter', sans-serif" font-size="11" fill="#92A6BE">Active Bookings</text>
      <text x="14" y="56" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="#5AB9E8">142</text>
      <text x="165" y="54" font-family="'Inter', sans-serif" font-size="11" fill="#5B6E86" text-anchor="end">/ 160 rms</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(392, 0)">
      <rect width="195" height="74" rx="6" fill="url(#cardGrad)" stroke="rgba(148, 187, 224, 0.2)" stroke-width="1"/>
      <text x="14" y="26" font-family="'Inter', sans-serif" font-size="11" fill="#92A6BE">Monthly Revenue</text>
      <text x="14" y="56" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="#E8A33D">€64,820</text>
      <rect x="135" y="14" width="46" height="18" rx="9" fill="rgba(232, 163, 61, 0.15)"/>
      <text x="158" y="26" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F5BE6B" text-anchor="middle">REST API</text>
    </g>
  </g>

  <!-- Main Calendar / Room Matrix Grid -->
  <g transform="translate(180, 148)">
    <rect width="588" height="325" rx="8" fill="url(#cardGrad)" stroke="rgba(148, 187, 224, 0.2)" stroke-width="1"/>
    <text x="18" y="28" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#E7EEF6">Live Room Scheduling &amp; Allocation Grid</text>
    <rect x="475" y="14" width="95" height="22" rx="4" fill="rgba(90, 185, 232, 0.12)" stroke="rgba(90, 185, 232, 0.4)" stroke-width="0.8"/>
    <text x="522" y="28" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8CD4F5" text-anchor="middle">+ New Booking</text>

    <!-- Table header -->
    <rect x="18" y="44" width="552" height="26" fill="#0A1220" rx="3"/>
    <text x="30" y="60" font-family="'JetBrains Mono', monospace" font-size="10" fill="#92A6BE">ROOM #</text>
    <text x="95" y="60" font-family="'JetBrains Mono', monospace" font-size="10" fill="#92A6BE">CATEGORY</text>
    <text x="210" y="60" font-family="'JetBrains Mono', monospace" font-size="10" fill="#92A6BE">GUEST NAME</text>
    <text x="350" y="60" font-family="'JetBrains Mono', monospace" font-size="10" fill="#92A6BE">CHECK-IN / OUT</text>
    <text x="490" y="60" font-family="'JetBrains Mono', monospace" font-size="10" fill="#92A6BE">STATUS</text>

    <!-- Row 1 -->
    <rect x="18" y="78" width="552" height="36" fill="#101D33" rx="3" stroke="rgba(148,187,224,0.08)"/>
    <text x="30" y="100" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#E7EEF6">101</text>
    <text x="95" y="100" font-family="'Inter', sans-serif" font-size="11" fill="#92A6BE">Deluxe Suite</text>
    <text x="210" y="100" font-family="'Inter', sans-serif" font-size="11" fill="#E7EEF6">Alexander Wright</text>
    <text x="350" y="100" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8CD4F5">Oct 21 – Oct 26</text>
    <rect x="480" y="86" width="75" height="18" rx="4" fill="rgba(111, 207, 151, 0.15)"/>
    <text x="517" y="99" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6FCF97" text-anchor="middle">CONFIRMED</text>

    <!-- Row 2 -->
    <rect x="18" y="122" width="552" height="36" fill="#0D1829" rx="3"/>
    <text x="30" y="144" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#E7EEF6">102</text>
    <text x="95" y="144" font-family="'Inter', sans-serif" font-size="11" fill="#92A6BE">Executive King</text>
    <text x="210" y="144" font-family="'Inter', sans-serif" font-size="11" fill="#E7EEF6">Elena Rossi</text>
    <text x="350" y="144" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8CD4F5">Oct 22 – Oct 25</text>
    <rect x="480" y="130" width="75" height="18" rx="4" fill="rgba(90, 185, 232, 0.15)"/>
    <text x="517" y="143" font-family="'JetBrains Mono', monospace" font-size="9" fill="#5AB9E8" text-anchor="middle">OCCUPIED</text>

    <!-- Row 3 -->
    <rect x="18" y="166" width="552" height="36" fill="#101D33" rx="3"/>
    <text x="30" y="188" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#E7EEF6">103</text>
    <text x="95" y="188" font-family="'Inter', sans-serif" font-size="11" fill="#92A6BE">Standard Double</text>
    <text x="210" y="188" font-family="'Inter', sans-serif" font-size="11" fill="#E7EEF6">Marcus Vance</text>
    <text x="350" y="188" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8CD4F5">Oct 24 – Oct 28</text>
    <rect x="480" y="174" width="75" height="18" rx="4" fill="rgba(232, 163, 61, 0.15)"/>
    <text x="517" y="187" font-family="'JetBrains Mono', monospace" font-size="9" fill="#E8A33D" text-anchor="middle">PENDING</text>

    <!-- Row 4 -->
    <rect x="18" y="210" width="552" height="36" fill="#0D1829" rx="3"/>
    <text x="30" y="232" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#E7EEF6">201</text>
    <text x="95" y="232" font-family="'Inter', sans-serif" font-size="11" fill="#92A6BE">Penthouse Suite</text>
    <text x="210" y="232" font-family="'Inter', sans-serif" font-size="11" fill="#E7EEF6">Sophie Laurent</text>
    <text x="350" y="232" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8CD4F5">Oct 21 – Oct 29</text>
    <rect x="480" y="218" width="75" height="18" rx="4" fill="rgba(111, 207, 151, 0.15)"/>
    <text x="517" y="231" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6FCF97" text-anchor="middle">CHECKED IN</text>

    <!-- Bottom summary footer -->
    <text x="25" y="290" font-family="'JetBrains Mono', monospace" font-size="10" fill="#5B6E86">Angular 18 Frontend · Spring Boot 3.3 REST API · PostgreSQL Database</text>
  </g>
</svg>
